<!-- send-email.component.html -->
<div class="container">
  <h2>Send Email</h2>
  <form (ngSubmit)="sendEmail()">
    <div class="form-group">
      <label for="recipientEmail">
        <i class="fas fa-envelope"></i> To
      </label>
      <input type="email" class="form-control" id="recipientEmail" [(ngModel)]="recipientEmail" name="recipientEmail" required />
    </div>
    <div class="form-group">
      <label for="subject">
        <i class="fas fa-pencil-alt"></i> Subject
      </label>
      <input type="text" class="form-control" id="subject" [(ngModel)]="subject" name="subject" required />
    </div>
    <div class="form-group">
      <label for="body">
        <i class="fas fa-comment-dots"></i> Message
      </label>
      <textarea class="form-control" id="body" [(ngModel)]="body" name="body" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-paper-plane"></i> Send Email
    </button>
  </form>

  <div *ngIf="responseMessage" class="mt-3">
    <p>{{ responseMessage }}</p>
  </div>
</div>
